# Mention @claude in an issue or PR comment to hand it a task.
# claude-code-action handles branch + commit + progress comment; we add the browser evidence.
name: Claude (@claude)

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Uses the runner's preinstalled Chrome; downloads Chromium if there is none.
      - name: Set up browser for playwright-cli
        run: npx playwright-cli install

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Edit,Write,Glob,Grep,Skill,Bash(npm run *),Bash(npx playwright-cli *),Bash(mkdir -p artifacts),Bash(git *)"

      - name: Stop app
        if: always()
        run: npm run app:down

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            artifacts/
            .app-up.log
          if-no-files-found: warn

      - name: Post evidence
        if: always() && hashFiles('artifacts/*') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KIND: ${{ github.event.issue.pull_request && 'pr' || 'issue' }}
          NUMBER: ${{ github.event.issue.number }}
        run: bash scripts/ci-post-evidence.sh comment "$KIND" "$NUMBER"
